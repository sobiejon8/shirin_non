<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shirin Non - Buyurtma berish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 pb-24 text-gray-800">
    <h1 class="text-2xl font-bold text-center text-amber-700 mb-4">🍞 Shirin Non Sexi</h1>

    <!-- Mahsulotlar Ro'yxati -->
    <div id="products-list" class="space-y-4 mb-6"></div>

    <!-- Buyurtma ma'lumotlari -->
    <div class="bg-white p-4 rounded-xl shadow space-y-3">
        <div>
            <label class="block text-sm font-medium mb-1">Mijoz / Do'kon nomi:</label>
            <input type="text" id="customer_name" placeholder='Masalan: Do`kon "Yulduz"' class="w-full border p-2 rounded-lg text-sm" required>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Telefon raqam:</label>
            <input type="tel" id="phone_number" placeholder="+998901234567" class="w-full border p-2 rounded-lg text-sm" required>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">⏰ Soat nechiga kerak?</label>
            <input type="time" id="requested_time" class="w-full border p-2 rounded-lg text-sm font-bold text-amber-700" required>
        </div>
    </div>

    <!-- Tasdiqlash Tugmasi -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t flex justify-between items-center shadow-lg">
        <div>
            <span class="text-xs text-gray-500">Jami summa:</span>
            <div id="total-price" class="text-xl font-extrabold text-amber-600">0 so'm</div>
        </div>
        <button onclick="submitOrder()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-6 py-3 rounded-xl shadow">
            Buyurtma berish 🚀
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let products = [];
        let quantities = {};

        async function fetchProducts() {
            const res = await fetch('/api/products');
            products = await res.json();
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('products-list');
            container.innerHTML = '';
            products.forEach(p => {
                quantities[p.id] = quantities[p.id] || 0;
                container.innerHTML += `
                    <div class="bg-white p-3 rounded-xl shadow flex items-center justify-between">
                        <img src="${p.image_url || 'https://via.placeholder.com/80'}" class="w-20 h-20 object-cover rounded-lg">
                        <div class="flex-1 ml-3">
                            <h3 class="font-bold text-base text-gray-900">${p.title}</h3>
                            <p class="text-amber-600 font-semibold text-sm">${p.price.toLocaleString()} so'm</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="changeQty(${p.id}, -5)" class="bg-gray-200 text-xl font-bold px-3 py-1 rounded-lg">-</button>
                            <span id="qty-${p.id}" class="font-bold min-w-[24px] text-center">${quantities[p.id]}</span>
                            <button onclick="changeQty(${p.id}, 5)" class="bg-amber-600 text-white text-xl font-bold px-3 py-1 rounded-lg">+</button>
                        </div>
                    </div>
                `;
            });
            updateTotal();
        }

        function changeQty(id, delta) {
            quantities[id] = Math.max(0, (quantities[id] || 0) + delta);
            document.getElementById(`qty-${id}`).innerText = quantities[id];
            updateTotal();
        }

        function updateTotal() {
            let total = 0;
            products.forEach(p => {
                total += (quantities[p.id] || 0) * p.price;
            });
            document.getElementById('total-price').innerText = total.toLocaleString() + " so'm";
        }

        async function submitOrder() {
            const customer_name = document.getElementById('customer_name').value.trim();
            const phone_number = document.getElementById('phone_number').value.trim();
            const requested_time = document.getElementById('requested_time').value;

            if (!customer_name || !phone_number || !requested_time) {
                alert("Iltimos, barcha maydonlarni to'ldiring!");
                return;
            }

            const items = products.filter(p => quantities[p.id] > 0).map(p => ({
                product_id: p.id,
                quantity: quantities[p.id]
            }));

            if (items.length === 0) {
                alert("Kamida bitta mahsulot tanlang!");
                return;
            }

            const response = await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    customer_name,
                    phone_number,
                    requested_time,
                    items
                })
            });

            if (response.ok) {
                alert("Buyurtmangiz qabul qilindi! Rahmat.");
                tg.close();
            } else {
                alert("Xatolik yuz berdi. Qayta urinib ko'ring.");
            }
        }

        fetchProducts();
    </script>
</body>
</html>
