<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shirin Non Sexi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .card-3d {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 16px;
        }
    </style>
</head>
<body class="p-4 pb-28">

    <div class="text-center my-4">
        <h1 class="text-2xl font-extrabold text-amber-400 tracking-wide">🍞 Shirin Non Sexi</h1>
        <p class="text-xs text-gray-400 mt-1">Sifatli va mazali non mahsulotlari</p>
    </div>

    <!-- Mahsulotlar Ro'yxati -->
    <div class="space-y-4">

        <!-- Borka Katta -->
        <div class="card-3d p-3 flex items-center space-x-3">
            <img src="/static/images/borka.jpg" onerror="this.src='https://via.placeholder.com/80?text=Borka'" class="w-20 h-20 object-cover rounded-xl border border-amber-500/30">
            <div class="flex-1">
                <h3 class="font-bold text-base text-gray-100">Borka (katta)</h3>
                <p class="text-amber-400 font-semibold text-sm">3 000 so'm</p>
                <div class="mt-2 flex items-center space-x-2">
                    <span class="text-xs text-gray-400">Soni:</span>
                    <input type="number" min="0" value="0" data-price="3000" data-name="Borka (katta)" oninput="calculateTotal()" class="count-input w-24 bg-slate-900 border border-amber-500/40 rounded-lg text-center py-1.5 text-white font-bold text-sm focus:outline-none focus:border-amber-400">
                </div>
            </div>
        </div>

        <!-- Kichik Borka -->
        <div class="card-3d p-3 flex items-center space-x-3">
            <img src="/static/images/borka.jpg" onerror="this.src='https://via.placeholder.com/80?text=Kichik+Borka'" class="w-20 h-20 object-cover rounded-xl border border-amber-500/30">
            <div class="flex-1">
                <h3 class="font-bold text-base text-gray-100">Kichik borka</h3>
                <p class="text-amber-400 font-semibold text-sm">2 800 so'm</p>
                <div class="mt-2 flex items-center space-x-2">
                    <span class="text-xs text-gray-400">Soni:</span>
                    <input type="number" min="0" value="0" data-price="2800" data-name="Kichik borka" oninput="calculateTotal()" class="count-input w-24 bg-slate-900 border border-amber-500/40 rounded-lg text-center py-1.5 text-white font-bold text-sm focus:outline-none focus:border-amber-400">
                </div>
            </div>
        </div>

        <!-- Kekis -->
        <div class="card-3d p-3 flex items-center space-x-3">
            <img src="/static/images/kekis.jpg" onerror="this.src='https://via.placeholder.com/80?text=Kekis'" class="w-20 h-20 object-cover rounded-xl border border-amber-500/30">
            <div class="flex-1">
                <h3 class="font-bold text-base text-gray-100">Kekis (1 salafan)</h3>
                <p class="text-amber-400 font-semibold text-sm">15 000 so'm</p>
                <div class="mt-2 flex items-center space-x-2">
                    <span class="text-xs text-gray-400">Soni:</span>
                    <input type="number" min="0" value="0" data-price="15000" data-name="Kekis (1 salafan)" oninput="calculateTotal()" class="count-input w-24 bg-slate-900 border border-amber-500/40 rounded-lg text-center py-1.5 text-white font-bold text-sm focus:outline-none focus:border-amber-400">
                </div>
            </div>
        </div>

        <!-- Qora Borka -->
        <div class="card-3d p-3 flex items-center space-x-3">
            <img src="/static/images/borka.jpg" onerror="this.src='https://via.placeholder.com/80?text=Qora+Borka'" class="w-20 h-20 object-cover rounded-xl border border-amber-500/30">
            <div class="flex-1">
                <h3 class="font-bold text-base text-gray-100">Qora borka noni</h3>
                <p class="text-amber-400 font-semibold text-sm">7 000 so'm</p>
                <div class="mt-2 flex items-center space-x-2">
                    <span class="text-xs text-gray-400">Soni:</span>
                    <input type="number" min="0" value="0" data-price="7000" data-name="Qora borka noni" oninput="calculateTotal()" class="count-input w-24 bg-slate-900 border border-amber-500/40 rounded-lg text-center py-1.5 text-white font-bold text-sm focus:outline-none focus:border-amber-400">
                </div>
            </div>
        </div>

    </div>

    <!-- Mijoz Ma'lumotlari Formasi -->
    <div class="card-3d p-4 mt-6 space-y-3">
        <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Mijoz / Do'kon nomi:</label>
            <input type="text" id="client_name" placeholder="Masalan: Elnur do'koni" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Telefon raqam:</label>
            <input type="tel" id="client_phone" placeholder="+998 90 123 45 67" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">⏰ Soat nechiga kerak?</label>
            <input type="text" id="delivery_time" placeholder="Masalan: Soat 07:30 gacha" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>
    </div>

    <!-- Pastki Jami Summa va Buyurtma Tugmasi -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-slate-950/90 backdrop-blur-md border-t border-slate-800 flex items-center justify-between z-50">
        <div>
            <span class="text-xs text-gray-400 block">Jami summa:</span>
            <span id="total_price" class="text-lg font-bold text-amber-400">0 so'm</span>
        </div>
        <button onclick="sendOrder()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm transition shadow-lg shadow-amber-500/20">
            Buyurtma berish 🚀
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function calculateTotal() {
            let total = 0;
            document.querySelectorAll('.count-input').forEach(input => {
                const count = parseInt(input.value) || 0;
                const price = parseInt(input.dataset.price);
                total += count * price;
            });
            document.getElementById('total_price').innerText = total.toLocaleString('uz-UZ') + " so'm";
        }

        function sendOrder() {
            const name = document.getElementById('client_name').value.trim();
            const phone = document.getElementById('client_phone').value.trim();
            const time = document.getElementById('delivery_time').value.trim();

            if(!name || !phone) {
                alert("Iltimos, ismingiz va telefon raqamingizni kiriting!");
                return;
            }

            let items = [];
            let totalSum = 0;

            document.querySelectorAll('.count-input').forEach(input => {
                const count = parseInt(input.value) || 0;
                if(count > 0) {
                    const itemName = input.dataset.name;
                    const price = parseInt(input.dataset.price);
                    items.push({
                        name: itemName,
                        count: count,
                        price: price,
                        sum: count * price
                    });
                    totalSum += count * price;
                }
            });

            if(items.length === 0) {
                alert("Kamida bitta mahsulot miqdorini kiriting!");
                return;
            }

            const data = {
                client_name: name,
                phone: phone,
                delivery_time: time,
                items: items,
                total_sum: totalSum
            };

            try {
                tg.sendData(JSON.stringify(data));
                tg.close();
            } catch (e) {
                alert("Buyurtma yuborildi!");
            }
        }
    </script>
</body>
</html>
